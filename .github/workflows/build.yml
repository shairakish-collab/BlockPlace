name: Build Android .so

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build zip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Print real SDK headers (temporary debug step)
        run: |
          echo "===== ModMenu.hpp ====="
          cat build/_deps/preloader_android-src/include/pl/ModMenu.hpp
          echo "===== Mod.hpp ====="
          cat build/_deps/preloader_android-src/include/pl/Mod.hpp

      - name: Build
        run: cmake --build build --config Release
        
      - name: Package .levipack
        run: |
          mkdir -p dist
          cp build/librandom_block_placement.so dist/
          cp manifest.json dist/
          # cp icon.png dist/   # add an icon.png to the repo root to include one
          cd dist && zip -r ../RandomBlockPlacement.levipack .

      - uses: actions/upload-artifact@v4
        with:
          name: RandomBlockPlacement.levipack
          path: RandomBlockPlacement.levipack
